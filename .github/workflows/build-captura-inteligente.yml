name: Gerar Captura Inteligente para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "captura-inteligente/**"
      - ".github/workflows/build-captura-inteligente.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: windows-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        working-directory: captura-inteligente
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt pyinstaller

      - name: Executar testes
        working-directory: captura-inteligente
        run: python -m unittest discover -s tests -v

      - name: Gerar programa
        working-directory: captura-inteligente
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --windowed
          --name Captura-Inteligente-PJ
          app.py

      - name: Incluir instruções e iniciador
        shell: powershell
        run: |
          Copy-Item captura-inteligente\README.md captura-inteligente\dist\Captura-Inteligente-PJ\LEIA-ME.txt
          '@echo off' | Set-Content -Encoding ascii captura-inteligente\dist\Captura-Inteligente-PJ\INICIAR.bat
          'cd /d "%~dp0"' | Add-Content -Encoding ascii captura-inteligente\dist\Captura-Inteligente-PJ\INICIAR.bat
          'start "" "Captura-Inteligente-PJ.exe"' | Add-Content -Encoding ascii captura-inteligente\dist\Captura-Inteligente-PJ\INICIAR.bat

      - name: Publicar programa
        uses: actions/upload-artifact@v4
        with:
          name: Captura-Inteligente-PJ-Windows
          path: captura-inteligente/dist/Captura-Inteligente-PJ/
          if-no-files-found: error
          retention-days: 30

