name: Gerar programa para Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "database.py"
      - ".github/workflows/build-windows.yml"

permissions:
  contents: read

jobs:
  test-and-build:
    name: Testar e gerar EXE
    runs-on: windows-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar empacotador
        run: python -m pip install --upgrade pyinstaller

      - name: Executar testes
        run: python -m unittest discover -s tests -v

      - name: Gerar executável
        run: >-
          python -m PyInstaller
          --noconfirm
          --clean
          --onedir
          --windowed
          --name AtendeMP-Bonito
          app.py

      - name: Gerar versão de diagnóstico
        run: >-
          python -m PyInstaller
          --noconfirm
          --onedir
          --console
          --name AtendeMP-Bonito-Diagnostico
          app.py

      - name: Criar iniciadores auxiliares
        shell: powershell
        run: |
          '@echo off' | Set-Content -Encoding ascii dist\AtendeMP-Bonito\INICIAR.bat
          'cd /d "%~dp0"' | Add-Content -Encoding ascii dist\AtendeMP-Bonito\INICIAR.bat
          'start "" "AtendeMP-Bonito.exe"' | Add-Content -Encoding ascii dist\AtendeMP-Bonito\INICIAR.bat
          '@echo off' | Set-Content -Encoding ascii dist\AtendeMP-Bonito-Diagnostico\INICIAR-DIAGNOSTICO.bat
          'cd /d "%~dp0"' | Add-Content -Encoding ascii dist\AtendeMP-Bonito-Diagnostico\INICIAR-DIAGNOSTICO.bat
          '"AtendeMP-Bonito-Diagnostico.exe"' | Add-Content -Encoding ascii dist\AtendeMP-Bonito-Diagnostico\INICIAR-DIAGNOSTICO.bat
          'echo.' | Add-Content -Encoding ascii dist\AtendeMP-Bonito-Diagnostico\INICIAR-DIAGNOSTICO.bat
          'echo Codigo de saida: %ERRORLEVEL%' | Add-Content -Encoding ascii dist\AtendeMP-Bonito-Diagnostico\INICIAR-DIAGNOSTICO.bat
          'pause' | Add-Content -Encoding ascii dist\AtendeMP-Bonito-Diagnostico\INICIAR-DIAGNOSTICO.bat

      - name: Publicar programa para download
        uses: actions/upload-artifact@v4
        with:
          name: AtendeMP-Bonito-Windows
          path: |
            dist/AtendeMP-Bonito/
            dist/AtendeMP-Bonito-Diagnostico/
          if-no-files-found: error
          retention-days: 30
