<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Central IA — Projetos e Assistentes</title>
  <style>
    :root{--navy:#102a43;--blue:#2563eb;--sky:#eaf2ff;--bg:#f4f7fb;--card:#fff;--text:#172033;--muted:#64748b;--line:#dbe3ef;--green:#15803d;--amber:#b45309;--red:#b91c1c;--shadow:0 8px 28px rgba(15,42,67,.09)}
    *{box-sizing:border-box}body{margin:0;font-family:Inter,Segoe UI,Arial,sans-serif;background:var(--bg);color:var(--text)}button,input,select,textarea{font:inherit}button{cursor:pointer}.hidden{display:none!important}
    .app{display:grid;grid-template-columns:250px 1fr;min-height:100vh}.side{background:var(--navy);color:#fff;padding:22px 14px;position:sticky;top:0;height:100vh}.brand{padding:0 10px 18px;border-bottom:1px solid #ffffff28}.brand b{font-size:21px}.brand small{display:block;color:#cbd5e1;margin-top:5px}.nav{display:grid;gap:5px;margin-top:18px}.nav button{border:0;background:transparent;color:#dbeafe;text-align:left;padding:11px 12px;border-radius:9px}.nav button:hover,.nav button.active{background:#ffffff18;color:#fff}.side-note{position:absolute;bottom:18px;padding:0 10px;color:#a9bdd2;font-size:12px;line-height:1.45}
    main{min-width:0}.top{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:14px;padding:0 28px;position:sticky;top:0;z-index:5}.search{flex:1;max-width:650px;position:relative}.search input{width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:10px;background:#f8fafc}.top .primary{margin-left:auto}.content{padding:26px 28px 48px;max-width:1500px;margin:auto}.page-head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px}.page-head h1{margin:0 0 5px;font-size:27px}.page-head p{margin:0;color:var(--muted)}
    .btn{border:1px solid var(--line);background:#fff;color:var(--text);padding:9px 13px;border-radius:9px;font-weight:600}.btn:hover{border-color:#9fb2ca}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{color:var(--red)}.ghost{background:transparent}.small{padding:6px 9px;font-size:13px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:22px}.stat{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.stat span{color:var(--muted);font-size:13px}.stat strong{display:block;font-size:29px;margin-top:7px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:15px}.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:17px;box-shadow:var(--shadow);min-width:0}.card h3{margin:8px 0;font-size:17px}.card p{color:var(--muted);font-size:14px;line-height:1.5;overflow-wrap:anywhere}.card-top{display:flex;align-items:center;gap:11px}.avatar{width:44px;height:44px;border-radius:12px;background:var(--sky);display:grid;place-items:center;font-weight:800;color:var(--blue);overflow:hidden}.avatar img{width:100%;height:100%;object-fit:cover}.grow{flex:1;min-width:0}.tag{display:inline-block;font-size:11px;font-weight:700;background:#eef2ff;color:#3730a3;border-radius:999px;padding:4px 8px;margin:2px}.tag.green{background:#dcfce7;color:#166534}.tag.amber{background:#fef3c7;color:#92400e}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:14px}.empty{text-align:center;background:#fff;border:1px dashed #b8c5d7;border-radius:14px;padding:42px;color:var(--muted)}
    .list{display:grid;gap:10px}.row{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 16px;display:flex;align-items:center;gap:14px}.row-main{flex:1;min-width:0}.row-main b{display:block;margin-bottom:4px}.row-main small{color:var(--muted)}.progress{height:8px;background:#e5e7eb;border-radius:8px;overflow:hidden;margin-top:8px}.progress i{display:block;height:100%;background:var(--blue)}
    dialog{border:0;border-radius:16px;padding:0;width:min(760px,94vw);max-height:92vh;box-shadow:0 24px 80px #0004}dialog::backdrop{background:#0f172a99}.modal-head{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center}.modal-head h2{margin:0;font-size:20px}.modal-head button{margin-left:auto}.form{padding:20px 22px;overflow:auto;max-height:72vh}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{border:1px solid #cbd5e1;border-radius:9px;padding:10px;background:#fff;width:100%}.field textarea{min-height:90px;resize:vertical}.hint{font-size:12px;color:var(--muted)}.modal-foot{padding:14px 22px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:9px}.detail pre{white-space:pre-wrap;font-family:inherit;background:#f8fafc;border:1px solid var(--line);padding:12px;border-radius:9px;line-height:1.5}.detail dt{font-size:12px;color:var(--muted);font-weight:700;margin-top:14px}.detail dd{margin:4px 0 0;white-space:pre-wrap;overflow-wrap:anywhere}.notice{padding:12px 14px;border-radius:10px;background:#fff7ed;color:#9a3412;border:1px solid #fed7aa;font-size:13px;margin-bottom:18px}.toast{position:fixed;right:22px;bottom:22px;background:#102a43;color:#fff;padding:12px 16px;border-radius:10px;box-shadow:var(--shadow);z-index:50}.mobile{display:none}
    @media(max-width:900px){.app{grid-template-columns:1fr}.side{position:fixed;z-index:20;left:-260px;width:250px;transition:.2s}.side.open{left:0}.mobile{display:inline-flex}.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr 1fr}.top{padding:0 15px}.content{padding:20px 15px}}
    @media(max-width:600px){.grid,.stats,.fields{grid-template-columns:1fr}.field.full{grid-column:auto}.page-head{align-items:flex-start;flex-direction:column}.top .primary{display:none}}
  </style>
</head>
<body>
<div class="app">
  <aside class="side" id="side">
    <div class="brand"><b>Central IA</b><small>Projetos e Assistentes</small></div>
    <nav class="nav" id="nav">
      <button data-page="painel" class="active">▦ Painel</button><button data-page="assistentes">✦ Assistentes</button><button data-page="projetos">▣ Projetos</button><button data-page="prompts">⌘ Prompts</button><button data-page="biblioteca">▤ Biblioteca</button><button data-page="fluxos">⇄ Fluxos de trabalho</button><button data-page="interacoes">☷ Interações</button><button data-page="config">⚙ Backup e dados</button>
    </nav>
    <div class="side-note">Os dados ficam neste navegador.<br>Faça backups regularmente.</div>
  </aside>
  <main>
    <header class="top"><button class="btn mobile" id="menu">☰</button><div class="search"><input id="globalSearch" placeholder="Pesquisar em toda a Central IA..."></div><button class="btn primary" id="quickAdd">+ Novo registro</button></header>
    <section class="content" id="content"></section>
  </main>
</div>

<dialog id="editor"><form method="dialog" id="editorForm"><div class="modal-head"><h2 id="editorTitle"></h2><button class="btn small" value="cancel">✕</button></div><div class="form"><div class="fields" id="editorFields"></div></div><div class="modal-foot"><button class="btn" value="cancel">Cancelar</button><button class="btn primary" id="saveBtn" value="default">Salvar</button></div></form></dialog>
<dialog id="viewer"><div class="modal-head"><h2 id="viewerTitle"></h2><button class="btn small" onclick="viewer.close()">✕</button></div><div class="form detail" id="viewerBody"></div><div class="modal-foot"><button class="btn" onclick="viewer.close()">Fechar</button></div></dialog>
<input id="importInput" type="file" accept="application/json" class="hidden"><div class="toast hidden" id="toast"></div>

<script>
const TYPES={
 assistentes:{label:'Assistente',plural:'Assistentes',icon:'✦',fields:[['nome','Nome','text',1],['plataforma','Plataforma','select:ChatGPT|Gemini Gem|NotebookLM|Claude|Copilot|Outro'],['categoria','Categoria','text'],['status','Status','select:Ativo|Em teste|Planejado|Arquivado'],['link','Link de acesso','url',1],['descricao','O que faz','textarea',1],['instrucoes','Instruções de uso','textarea',1],['prompt','Prompt principal/configuração','textarea',1],['comandos','Prompts rápidos (um por linha)','textarea',1],['limitacoes','Limitações e cuidados','textarea',1],['imagem','Link de imagem ou GIF','url',1],['tags','Palavras-chave separadas por vírgula','text',1]]},
 projetos:{label:'Projeto',plural:'Projetos',icon:'▣',fields:[['nome','Nome do projeto','text',1],['status','Status','select:Ideia|Planejamento|Em andamento|Em revisão|Concluído|Pausado'],['prioridade','Prioridade','select:Baixa|Média|Alta|Urgente'],['inicio','Data de início','date'],['prazo','Prazo','date'],['progresso','Progresso (%)','number'],['objetivo','Objetivo','textarea',1],['proximos','Próximas ações','textarea',1],['assistentes','Assistentes utilizados','text',1],['links','Links relacionados','textarea',1],['observacoes','Observações','textarea',1],['tags','Palavras-chave','text',1]]},
 prompts:{label:'Prompt',plural:'Prompts',icon:'⌘',fields:[['titulo','Título','text',1],['categoria','Categoria','text'],['plataforma','Plataforma indicada','select:Qualquer|ChatGPT|Gemini|NotebookLM|Claude|Copilot'],['finalidade','Finalidade','textarea',1],['conteudo','Texto do prompt','textarea',1],['variaveis','Dados que devem ser substituídos','textarea',1],['exemplo','Exemplo de resultado','textarea',1],['tags','Palavras-chave','text',1]]},
 biblioteca:{label:'Item da biblioteca',plural:'Biblioteca',icon:'▤',fields:[['titulo','Título','text',1],['tipo','Tipo','select:PDF|Texto|Vídeo|Modelo|Link|Imagem|Outro'],['categoria','Categoria','text'],['link','Link (OneDrive, Drive, site etc.)','url',1],['descricao','Descrição/resumo','textarea',1],['arquivo','Anexar arquivo','file',1],['tags','Palavras-chave','text',1]]},
 fluxos:{label:'Fluxo de trabalho',plural:'Fluxos de trabalho',icon:'⇄',fields:[['nome','Nome do fluxo','text',1],['finalidade','Finalidade','textarea',1],['entrada','O que é necessário para começar','textarea',1],['etapas','Etapas (uma por linha)','textarea',1],['ferramentas','Assistentes/ferramentas utilizados','textarea',1],['resultado','Resultado esperado','textarea',1],['cuidados','Pontos de conferência e cuidados','textarea',1],['tags','Palavras-chave','text',1]]},
 interacoes:{label:'Interação',plural:'Interações',icon:'☷',fields:[['titulo','Título/assunto','text',1],['data','Data','date'],['assistente','Assistente utilizado','text'],['projeto','Projeto relacionado','text'],['entrada','Pergunta ou conteúdo enviado','textarea',1],['resultado','Resultado obtido','textarea',1],['avaliacao','Avaliação','select:Excelente|Bom|Precisa melhorar|Não serviu'],['link','Link da conversa','url',1],['aprendizado','Observações e melhorias para próxima vez','textarea',1],['tags','Palavras-chave','text',1]]}
};
let state={page:'painel',data:{assistentes:[],projetos:[],prompts:[],biblioteca:[],fluxos:[],interacoes:[]},editing:null,query:''};
const $=s=>document.querySelector(s), esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
function save(){localStorage.setItem('centralIA.v1',JSON.stringify(state.data))}
function load(){try{const d=JSON.parse(localStorage.getItem('centralIA.v1'));if(d) Object.keys(state.data).forEach(k=>state.data[k]=Array.isArray(d[k])?d[k]:[])}catch(e){toast('Não foi possível ler os dados salvos.')}}
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2600)}
function navigate(page){state.page=page;state.query='';$('#globalSearch').value='';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#side').classList.remove('open');render()}
function filtered(type){const q=state.query.trim().toLowerCase();return state.data[type].filter(x=>!q||Object.values(x).some(v=>typeof v==='string'&&v.toLowerCase().includes(q)))}
function pageHead(title,desc,type){return `<div class="page-head"><div><h1>${esc(title)}</h1><p>${esc(desc)}</p></div>${type?`<button class="btn primary" onclick="openEditor('${type}')">+ Novo</button>`:''}</div>`}
function tags(s){return String(s||'').split(',').filter(Boolean).slice(0,5).map(x=>`<span class="tag">${esc(x.trim())}</span>`).join('')}
function render(){if(state.query){renderSearch();return} const fn=({painel:renderDashboard,config:renderConfig}[state.page]||(()=>renderCollection(state.page)));fn()}
function renderDashboard(){const d=state.data, active=d.projetos.filter(x=>!['Concluído','Pausado'].includes(x.status)).length;$('#content').innerHTML=pageHead('Visão geral','Organize seus assistentes, conteúdos e projetos')+`<div class="stats"><div class="stat"><span>Assistentes cadastrados</span><strong>${d.assistentes.length}</strong></div><div class="stat"><span>Projetos ativos</span><strong>${active}</strong></div><div class="stat"><span>Prompts salvos</span><strong>${d.prompts.length}</strong></div><div class="stat"><span>Itens na biblioteca</span><strong>${d.biblioteca.length}</strong></div></div><div class="page-head"><div><h1 style="font-size:20px">Acesso rápido</h1><p>Continue de onde parou</p></div></div><div class="grid">${quickCard('assistentes','Cadastrar e abrir GPTs, Gems e notebooks'),quickCard('projetos','Acompanhar demandas, prazos e resultados'),quickCard('prompts','Guardar comandos prontos para reutilização'),quickCard('biblioteca','Organizar arquivos, vídeos, modelos e links'),quickCard('fluxos','Combinar ferramentas em etapas práticas'),quickCard('interacoes','Registrar resultados e aprendizados')}</div>`}
function quickCard(type,desc){const t=TYPES[type];return `<div class="card"><div class="card-top"><div class="avatar">${t.icon}</div><div><h3>${t.plural}</h3><span class="tag green">${state.data[type].length} registro(s)</span></div></div><p>${desc}</p><div class="actions"><button class="btn small" onclick="navigate('${type}')">Abrir</button><button class="btn small primary" onclick="openEditor('${type}')">+ Novo</button></div></div>`}
function renderCollection(type){const t=TYPES[type],items=filtered(type);$('#content').innerHTML=pageHead(t.plural,description(type),type)+(items.length?`<div class="${type==='assistentes'?'grid':'list'}">${items.map(x=>type==='assistentes'?assistantCard(x):listRow(type,x)).join('')}</div>`:`<div class="empty"><h3>Nenhum registro ainda</h3><p>Use o botão “Novo” para começar.</p></div>`)}
function description(t){return {assistentes:'Catálogo de GPTs, Gems, notebooks e outras ferramentas',projetos:'Objetivos, prazos, andamento e próximos passos',prompts:'Comandos reutilizáveis com exemplos e variáveis',biblioteca:'Arquivos, vídeos, modelos, textos e links importantes',fluxos:'Rotinas que combinam diferentes ferramentas e etapas',interacoes:'Histórico do que foi solicitado e dos resultados obtidos'}[t]}
function assistantCard(x){const initials=(x.nome||'IA').split(' ').map(a=>a[0]).join('').slice(0,2).toUpperCase();return `<article class="card"><div class="card-top"><div class="avatar">${x.imagem?`<img src="${esc(x.imagem)}" onerror="this.parentNode.textContent='${esc(initials)}'">`:esc(initials)}</div><div class="grow"><h3>${esc(x.nome||'Sem nome')}</h3><span class="tag green">${esc(x.plataforma||'Outra')}</span> <span class="tag amber">${esc(x.status||'Ativo')}</span></div></div><p>${esc(x.descricao||'Sem descrição.')}</p><div>${tags(x.tags)}</div><div class="actions">${x.link?`<a class="btn small primary" href="${esc(x.link)}" target="_blank" rel="noopener">Abrir</a>`:''}<button class="btn small" onclick="viewItem('assistentes','${x.id}')">Detalhes</button><button class="btn small" onclick="openEditor('assistentes','${x.id}')">Editar</button></div></article>`}
function listRow(type,x){const title=x.nome||x.titulo||'Sem título',sub=x.descricao||x.objetivo||x.finalidade||x.resultado||x.status||'';return `<div class="row"><div class="avatar">${TYPES[type].icon}</div><div class="row-main"><b>${esc(title)}</b><small>${esc(String(sub).slice(0,180))}</small>${type==='projetos'?`<div class="progress"><i style="width:${Math.min(100,Math.max(0,+x.progresso||0))}%"></i></div>`:''}</div>${x.link?`<a class="btn small primary" href="${esc(x.link)}" target="_blank" rel="noopener">Abrir</a>`:''}${type==='prompts'?`<button class="btn small primary" onclick="copyPrompt('${x.id}')">Copiar</button>`:''}${x.fileData?`<button class="btn small" onclick="downloadAttachment('${x.id}')">Arquivo</button>`:''}<button class="btn small" onclick="viewItem('${type}','${x.id}')">Ver</button><button class="btn small" onclick="openEditor('${type}','${x.id}')">Editar</button></div>`}
function renderSearch(){const q=state.query,groups=Object.keys(TYPES).map(type=>[type,filtered(type)]).filter(x=>x[1].length);$('#content').innerHTML=pageHead('Resultados da pesquisa',`Busca por “${q}”`)+(groups.length?groups.map(([type,arr])=>`<h2 style="font-size:18px;margin-top:24px">${TYPES[type].plural} (${arr.length})</h2><div class="list">${arr.map(x=>listRow(type,x)).join('')}</div>`).join(''):'<div class="empty"><h3>Nenhum resultado encontrado</h3><p>Tente outra palavra-chave.</p></div>')}
function openEditor(type,id){const t=TYPES[type],item=id?state.data[type].find(x=>x.id===id):null;state.editing={type,id};$('#editorTitle').textContent=(id?'Editar ':'Novo ')+t.label;$('#editorFields').innerHTML=t.fields.map(([name,label,kind,full])=>fieldHTML(name,label,kind,item?.[name]||'',full)).join('');$('#editor').showModal()}
function fieldHTML(name,label,kind,value,full){const cls='field '+(full?'full':'');if(kind.startsWith('select:')){const opts=kind.slice(7).split('|');return `<div class="${cls}"><label>${label}</label><select name="${name}">${opts.map(o=>`<option ${o===value?'selected':''}>${o}</option>`).join('')}</select></div>`}if(kind==='textarea')return `<div class="${cls}"><label>${label}</label><textarea name="${name}">${esc(value)}</textarea></div>`;if(kind==='file')return `<div class="${cls}"><label>${label}</label><input name="${name}" type="file"><span class="hint">Arquivos grandes podem exceder o espaço do navegador. Use também o campo de link quando possível.</span>${value?`<span class="hint">Arquivo atual: ${esc(value)}</span>`:''}</div>`;return `<div class="${cls}"><label>${label}</label><input name="${name}" type="${kind}" value="${esc(value)}" ${kind==='number'?'min="0" max="100"':''}></div>`}
$('#editorForm').addEventListener('submit',async e=>{e.preventDefault();const {type,id}=state.editing,old=id?state.data[type].find(x=>x.id===id):null,obj=old?{...old}:{id:uid(),createdAt:new Date().toISOString()};for(const [name,,kind] of TYPES[type].fields){const el=e.target.elements[name];if(kind==='file'){if(el.files[0]){const f=el.files[0];if(f.size>8*1024*1024&&!confirm('O arquivo tem mais de 8 MB e pode ocupar muito espaço. Deseja continuar?'))continue;obj.fileName=f.name;obj.fileType=f.type;obj.fileData=await fileToDataURL(f)}continue}obj[name]=el.value.trim()}obj.updatedAt=new Date().toISOString();if(old)Object.assign(old,obj);else state.data[type].unshift(obj);save();$('#editor').close();render();toast('Registro salvo no navegador.')});
function fileToDataURL(f){return new Promise((res,rej)=>{const r=new FileReader;r.onload=()=>res(r.result);r.onerror=rej;r.readAsDataURL(f)})}
function viewItem(type,id){const x=state.data[type].find(a=>a.id===id),t=TYPES[type];$('#viewerTitle').textContent=x.nome||x.titulo||t.label;$('#viewerBody').innerHTML=t.fields.filter(([n,,k])=>k!=='file'&&x[n]).map(([n,l])=>`<dl><dt>${esc(l)}</dt><dd>${linkify(x[n])}</dd></dl>`).join('')+`<div class="actions">${x.fileData?`<button class="btn" onclick="downloadAttachment('${id}')">Baixar ${esc(x.fileName||'arquivo')}</button>`:''}<button class="btn" onclick="copyText('${type}','${id}')">Copiar informações</button><button class="btn danger" onclick="deleteItem('${type}','${id}')">Excluir</button></div>`;$('#viewer').showModal()}
function linkify(v){const s=esc(v);return /^https?:\/\//i.test(v)?`<a href="${s}" target="_blank" rel="noopener">${s}</a>`:s}
function deleteItem(type,id){if(!confirm('Excluir este registro? Esta ação não pode ser desfeita sem um backup.'))return;state.data[type]=state.data[type].filter(x=>x.id!==id);save();$('#viewer').close();render();toast('Registro excluído.')}
function copyPrompt(id){const x=state.data.prompts.find(a=>a.id===id);navigator.clipboard.writeText(x.conteudo||'').then(()=>toast('Prompt copiado.'))}
function copyText(type,id){const x=state.data[type].find(a=>a.id===id),text=TYPES[type].fields.filter(([n,,k])=>k!=='file'&&x[n]).map(([n,l])=>`${l}:\n${x[n]}`).join('\n\n');navigator.clipboard.writeText(text).then(()=>toast('Informações copiadas.'))}
function downloadAttachment(id){const x=state.data.biblioteca.find(a=>a.id===id);if(!x?.fileData)return;const a=document.createElement('a');a.href=x.fileData;a.download=x.fileName||'arquivo';a.click()}
function renderConfig(){const count=Object.values(state.data).reduce((n,a)=>n+a.length,0),size=(new Blob([JSON.stringify(state.data)]).size/1024/1024).toFixed(2);$('#content').innerHTML=pageHead('Backup e dados','Proteja e transfira sua Central IA')+`<div class="notice"><b>Importante:</b> estes dados ficam somente neste navegador e neste perfil do Windows. Eles não são enviados automaticamente para a internet. Faça backup sempre que inserir informações importantes.</div><div class="grid"><div class="card"><h3>Exportar backup</h3><p>Gera um arquivo com os ${count} registros e anexos armazenados.</p><button class="btn primary" onclick="exportBackup()">Baixar backup</button></div><div class="card"><h3>Restaurar backup</h3><p>Importe um backup criado anteriormente. Você poderá substituir ou juntar os registros.</p><button class="btn" onclick="$('#importInput').click()">Selecionar arquivo</button></div><div class="card"><h3>Uso aproximado</h3><p><b>${size} MB</b> armazenados. Arquivos anexados aumentam bastante este tamanho.</p></div><div class="card"><h3>Dados demonstrativos</h3><p>Inclui exemplos sem informação institucional real para conhecer o sistema.</p><button class="btn" onclick="addExamples()">Adicionar exemplos</button></div><div class="card"><h3>Limpar tudo</h3><p>Apaga os registros deste navegador. Exporte um backup antes.</p><button class="btn danger" onclick="clearAll()">Apagar dados</button></div></div>`}
function exportBackup(){const payload={app:'Central IA',version:1,exportedAt:new Date().toISOString(),data:state.data};const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(payload,null,2)],{type:'application/json'}));a.download=`Central-IA-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href);toast('Backup gerado.')}
$('#importInput').addEventListener('change',async e=>{try{const p=JSON.parse(await e.target.files[0].text());if(p.app!=='Central IA'||!p.data)throw Error();const merge=confirm('Clique OK para JUNTAR ao conteúdo atual. Clique Cancelar para SUBSTITUIR tudo pelo backup.');Object.keys(state.data).forEach(k=>{const incoming=Array.isArray(p.data[k])?p.data[k]:[];state.data[k]=merge?[...incoming,...state.data[k].filter(x=>!incoming.some(y=>y.id===x.id))]:incoming});save();render();toast('Backup restaurado.')}catch{alert('Arquivo de backup inválido.')}e.target.value=''})
function clearAll(){if(!confirm('Tem certeza de que deseja apagar TODOS os dados da Central IA?'))return;if(!confirm('Última confirmação: os dados só poderão ser recuperados por backup.'))return;Object.keys(state.data).forEach(k=>state.data[k]=[]);save();render();toast('Dados apagados.')}
function addExamples(){const now=new Date().toISOString();state.data.assistentes.unshift({id:uid(),nome:'Assistente de Minutas',plataforma:'ChatGPT',categoria:'Redação institucional',status:'Planejado',descricao:'Exemplo de assistente para organizar fatos e gerar uma primeira minuta sujeita à conferência.',instrucoes:'Informe o contexto, a finalidade, o destinatário e o prazo.',prompt:'Organize os fatos fornecidos e produza uma minuta institucional clara. Não invente dados e destaque lacunas para conferência.',comandos:'Criar minuta de ofício\nRevisar texto\nListar informações ausentes',limitacoes:'Todo conteúdo jurídico deve ser revisado por pessoa responsável.',tags:'minutas, revisão, institucional',createdAt:now,updatedAt:now});state.data.fluxos.unshift({id:uid(),nome:'Análise de documentos e elaboração de minuta',finalidade:'Organizar documentos antes de redigir uma manifestação.',entrada:'PDFs e objetivo da demanda.',etapas:'1. Inserir fontes no NotebookLM\n2. Gerar cronologia e lista de documentos\n3. Conferir referências\n4. Enviar dados conferidos ao assistente de minutas\n5. Revisar o resultado final',ferramentas:'NotebookLM + assistente de minutas',resultado:'Minuta com fatos organizados e pontos pendentes.',cuidados:'Não inserir documentos sigilosos em contas não autorizadas. Conferir nomes, datas, números e fundamentos.',tags:'documentos, minuta, conferência',createdAt:now,updatedAt:now});save();render();toast('Exemplos adicionados.')}
$('#globalSearch').addEventListener('input',e=>{state.query=e.target.value;render()});$('#nav').addEventListener('click',e=>{const b=e.target.closest('button[data-page]');if(b)navigate(b.dataset.page)});$('#menu').onclick=()=>$('#side').classList.toggle('open');$('#quickAdd').onclick=()=>openEditor(state.page in TYPES?state.page:'assistentes');
load();render();
</script>
</body>
