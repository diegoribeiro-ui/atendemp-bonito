<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Ferramentas da PJ de Bonito</title>
<style>
:root{--nav:#12324a;--blue:#1d63b7;--bg:#f3f6fa;--card:#fff;--text:#182230;--muted:#627386;--line:#d8e1eb;--green:#167447;--amber:#a65a00;--red:#b42318;--shadow:0 7px 24px #12324a12}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Segoe UI,Arial,sans-serif}button,input,select,textarea{font:inherit}.hidden{display:none!important}.app{display:grid;grid-template-columns:265px 1fr;min-height:100vh}.side{height:100vh;position:sticky;top:0;background:var(--nav);color:#fff;padding:20px 13px;overflow:auto}.brand{padding:0 10px 17px;border-bottom:1px solid #ffffff24}.brand b{font-size:20px}.brand small{display:block;color:#bfd0df;margin-top:5px}.nav{display:grid;gap:4px;margin-top:14px}.nav button{border:0;background:transparent;color:#d9e7f2;padding:10px 11px;text-align:left;border-radius:8px;cursor:pointer}.nav button:hover,.nav button.active{background:#ffffff19;color:#fff}.top{height:70px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 25px;gap:10px;position:sticky;top:0;z-index:5}.top input{flex:1;max-width:620px;border:1px solid var(--line);background:#f8fafc;border-radius:9px;padding:10px 13px}.content{padding:25px;max-width:1500px;margin:auto}.head{display:flex;align-items:flex-end;justify-content:space-between;gap:14px;margin-bottom:19px}.head h1{margin:0 0 4px;font-size:27px}.head p{margin:0;color:var(--muted)}.btn{border:1px solid var(--line);background:#fff;border-radius:8px;padding:9px 12px;font-weight:600;cursor:pointer;color:var(--text)}.btn:hover{border-color:#9cafc2}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{color:var(--red)}.small{font-size:12px;padding:6px 8px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}.card{background:#fff;border:1px solid var(--line);border-radius:13px;padding:17px;box-shadow:var(--shadow)}.card h3{margin:0 0 7px}.card p{color:var(--muted);font-size:14px;line-height:1.45}.tool-card{cursor:pointer}.tool-card:hover{transform:translateY(-1px);border-color:#a9b9ca}.icon{width:43px;height:43px;border-radius:11px;background:#e9f2ff;color:var(--blue);display:grid;place-items:center;font-weight:800;margin-bottom:11px}.form-card{max-width:1050px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field{display:grid;gap:6px}.full{grid-column:1/-1}.field label{font-size:13px;font-weight:700}.field input,.field select,.field textarea{width:100%;border:1px solid #c6d2df;border-radius:8px;padding:10px;background:#fff}.field textarea{min-height:92px;resize:vertical}.help{font-size:12px;color:var(--muted);line-height:1.35}.example{background:#eff6ff;border-left:3px solid var(--blue);padding:8px 10px;font-size:12px;color:#38516a;border-radius:4px}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.result{margin-top:18px;background:#fff;border:1px solid var(--line);border-radius:12px;padding:19px}.result h2{margin-top:0}.result pre{white-space:pre-wrap;font-family:Segoe UI,Arial,sans-serif;line-height:1.55;background:#f8fafc;padding:15px;border:1px solid var(--line);border-radius:8px}.notice{background:#fff7e8;border:1px solid #f4d097;color:#7a4700;padding:11px 13px;border-radius:9px;font-size:13px;margin-bottom:15px}.good{background:#eaf8f0;border-color:#b8e1c8;color:#175e38}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:13px;margin-bottom:18px}.stat{background:#fff;border:1px solid var(--line);border-radius:12px;padding:16px}.stat span{font-size:12px;color:var(--muted)}.stat b{display:block;font-size:26px;margin-top:6px}.list{display:grid;gap:9px}.row{display:flex;align-items:center;gap:12px;background:#fff;border:1px solid var(--line);border-radius:10px;padding:12px 14px}.grow{flex:1;min-width:0}.row b{display:block}.row small{color:var(--muted)}.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:99px;padding:4px 8px;background:#eaf2ff;color:#174f93}.tag.red{background:#fee8e7;color:#9d1c16}.tag.green{background:#e1f6e9;color:#17663c}.matrix{width:100%;border-collapse:collapse}.matrix th,.matrix td{border:1px solid var(--line);padding:7px;vertical-align:top}.matrix th{background:#eef3f8;font-size:12px}.matrix input,.matrix textarea,.matrix select{width:100%;border:1px solid #c8d4df;border-radius:6px;padding:7px}.matrix textarea{min-height:62px}.check{display:flex;gap:9px;align-items:flex-start;background:#f8fafc;border:1px solid var(--line);padding:9px;border-radius:8px}.check input{margin-top:3px}.check small{display:block;color:var(--muted);margin-top:3px}.tabs{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:14px}.tabs button.active{background:var(--blue);color:#fff;border-color:var(--blue)}.mobile{display:none}.toast{position:fixed;right:20px;bottom:20px;background:var(--nav);color:#fff;padding:11px 15px;border-radius:9px;z-index:30}.search-result{margin-top:15px}.overdue{color:var(--red)!important;font-weight:700}.today{color:var(--amber)!important;font-weight:700}
@media print{.side,.top,.head,.no-print,.actions{display:none!important}.app{display:block}.content{padding:0;max-width:none}.result,.card{box-shadow:none;border:0}.result pre{border:0}.print-title{display:block!important}body{background:#fff}}
@media(max-width:920px){.app{grid-template-columns:1fr}.side{position:fixed;left:-275px;width:265px;z-index:20;transition:.2s}.side.open{left:0}.mobile{display:inline-block}.grid{grid-template-columns:1fr 1fr}.stats{grid-template-columns:1fr 1fr}.content{padding:18px}.top{padding:0 14px}}
@media(max-width:620px){.grid,.fields,.stats{grid-template-columns:1fr}.full{grid-column:auto}.head{align-items:flex-start;flex-direction:column}.matrix{font-size:11px}}
</style>
</head><body>
<div class="app"><aside class="side" id="side"><div class="brand"><b>Ferramentas da PJ</b><small>Promotoria de Justiça de Bonito</small></div><nav class="nav" id="nav">
<button data-page="painel" class="active">▦ Painel</button><button data-page="tarefa">✓ Tarefa para estagiário</button><button data-page="ficha">▤ Ficha de análise</button><button data-page="oficios">✉ Ofícios e prazos</button><button data-page="comparador">⇄ Conferir resposta</button><button data-page="cronologia">◷ Cronologia dos autos</button><button data-page="checklist">☑ Checklist por assunto</button><button data-page="arquivo">⌁ Nome de arquivo</button><button data-page="email">@ E-mail institucional</button><button data-page="prompt">✦ Gerador de prompt</button><button data-page="revisor">⌕ Revisor de minuta</button><button data-page="biblioteca">▣ Modelos e casos</button><button data-page="historico">☷ Histórico gerado</button><button data-page="dados">⚙ Backup e dados</button>
</nav></aside><main><header class="top"><button class="btn mobile" id="menu">☰</button><input id="search" placeholder="Pesquisar no histórico, ofícios e biblioteca..."><button class="btn" onclick="navigate('dados')">Backup</button></header><section class="content" id="content"></section></main></div>
<div id="toast" class="toast hidden"></div><input id="importFile" type="file" accept="application/json" class="hidden">
<script>
const $=s=>document.querySelector(s),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(16).slice(2);
let state={page:'painel',data:{historico:[],oficios:[],biblioteca:[]},matrix:[],timeline:[]};
const PAGES={painel:['Painel','Ferramentas guiadas para as rotinas diárias'],tarefa:['Tarefa para estagiário','Gere uma orientação clara, completa e padronizada'],ficha:['Ficha guiada de análise','Organize os autos sem exigir conclusão jurídica do usuário'],oficios:['Controle de ofícios e prazos','Acompanhe expedições, respostas e pendências'],comparador:['Conferência de resposta','Compare cada solicitação com o que foi efetivamente respondido'],cronologia:['Cronologia dos autos','Organize acontecimentos, documentos, IDs e páginas'],checklist:['Checklist por assunto','Veja o que conferir e quais documentos podem ser necessários'],arquivo:['Padronizador de nomes','Gere nomes claros para documentos e inserção nos autos'],email:['E-mail institucional','Crie mensagens de encaminhamento, cobrança e comunicação'],prompt:['Gerador guiado de prompts','Prepare comandos completos sem precisar dominar IA'],revisor:['Revisor de minutas','Faça uma conferência objetiva antes da assinatura'],biblioteca:['Biblioteca de modelos e casos','Cadastre resumos, palavras-chave e links para arquivos'],historico:['Histórico gerado','Consulte os relatórios e textos salvos'],dados:['Backup e dados','Exporte, restaure ou limpe os dados locais']};
const TASKS={
'Conferir resposta de órgão':{objetivo:'Verificar se o órgão respondeu integralmente aos questionamentos constantes do ofício e se apresentou os documentos comprobatórios.',etapas:['Localizar o ofício expedido e o comprovante de envio.','Identificar separadamente cada pergunta ou requisição formulada.','Localizar, na resposta, o trecho correspondente a cada item.','Verificar se os documentos mencionados foram efetivamente anexados.','Classificar cada item como atendido, parcial, não atendido ou não localizado.','Registrar divergências, datas, valores e documentos ausentes.','Encaminhar a matriz preenchida ao servidor responsável.'],produto:'Matriz comparativa entre o ofício e a resposta, com indicação objetiva das pendências.',cuidados:'Não presumir informações, não elaborar conclusão jurídica e não considerar atendido um item sem localizar a resposta ou o documento correspondente.'},
'Organizar autos e produzir cronologia':{objetivo:'Organizar os principais acontecimentos dos autos em ordem cronológica, com referência aos documentos que comprovam cada fato.',etapas:['Identificar o documento inicial e o objeto do procedimento.','Percorrer os autos na ordem das páginas.','Registrar data, tipo de documento, órgão ou pessoa responsável, ID e páginas.','Resumir cada documento em linguagem objetiva.','Distinguir fatos, alegações e documentos comprobatórios.','Sinalizar datas divergentes e períodos sem movimentação.','Revisar a ordem cronológica antes do encaminhamento.'],produto:'Tabela cronológica dos autos e lista de pontos que exigem conferência.',cuidados:'Não alterar datas, não atribuir afirmações a quem não as realizou e sempre indicar a fonte nos autos.'},
'Preparar minuta de ofício':{objetivo:'Preparar uma primeira minuta de ofício com base no despacho ou orientação do responsável.',etapas:['Confirmar o número do procedimento.','Identificar corretamente o destinatário, cargo e órgão.','Localizar a determinação que fundamenta a expedição.','Listar de forma numerada as informações e documentos solicitados.','Inserir o prazo definido pelo responsável.','Relacionar os anexos mencionados.','Conferir nomes, datas, assunto e número antes de encaminhar.'],produto:'Minuta de ofício pronta para revisão do servidor ou membro.',cuidados:'Não criar diligências novas, não definir prazo por conta própria e não enviar o documento antes da revisão.'},
'Atualizar controle de prazo':{objetivo:'Verificar e atualizar a situação de prazos relacionados a ofícios, diligências ou retornos.',etapas:['Localizar a data de envio.','Confirmar o recebimento pelo destinatário.','Identificar o prazo concedido e a forma de contagem.','Verificar se existe pedido de prorrogação.','Localizar eventual resposta.','Atualizar o status e registrar observação objetiva.','Comunicar imediatamente prazo vencido ao responsável.'],produto:'Controle de prazo atualizado com situação e providência pendente.',cuidados:'Não alterar prazo sem autorização e não considerar resposta recebida apenas porque houve confirmação de leitura.'},
'Pesquisar documentos nos autos':{objetivo:'Localizar informações e documentos específicos solicitados pelo responsável.',etapas:['Registrar exatamente quais informações devem ser localizadas.','Pesquisar por nomes, números, datas e palavras-chave.','Anotar o ID e as páginas de cada ocorrência relevante.','Separar documentos principais de simples menções.','Registrar expressamente quando algo não for localizado.','Conferir os resultados antes de finalizar.'],produto:'Lista dos documentos e informações localizados, com ID, páginas e breve descrição.',cuidados:'Usar “não localizado” em vez de concluir que o documento não existe.'},
'Cadastrar atendimento ou notícia de fato':{objetivo:'Organizar os dados necessários ao registro do atendimento ou da notícia de fato no sistema institucional.',etapas:['Conferir a identificação e os contatos do interessado.','Identificar todas as pessoas e órgãos envolvidos.','Registrar os fatos em ordem lógica e objetiva.','Identificar local e datas relevantes.','Relacionar documentos apresentados.','Indicar providências já tentadas pelo interessado.','Registrar dados ausentes para posterior complementação.'],produto:'Ficha contendo partes, qualificações, assunto, resumo, documentos e pendências para conferência.',cuidados:'Preservar os termos essenciais do relato, evitar juízos antecipados e revisar dados pessoais antes do cadastro.'}}
const CHECKS={
'Saúde':['Documento pessoal e contato do paciente','Comprovante de residência','Cartão SUS, quando disponível','Relatório ou laudo médico atualizado','Receita médica legível','Descrição do tratamento, exame ou medicamento','Indicação de urgência ou risco','Comprovante de solicitação administrativa','Resposta ou negativa do Município/Estado','Informação sobre disponibilidade na rede pública','Orçamentos, quando pertinentes','Documentos do representante legal'],
'Educação':['Identificação do aluno e responsável','Comprovante de matrícula','Unidade escolar e série','Descrição objetiva do problema','Protocolos dirigidos à escola ou Secretaria','Respostas recebidas','Relatórios pedagógicos, quando pertinentes','Laudos ou avaliações, quando relacionados à demanda','Informações sobre transporte escolar','Fotografias ou documentos comprobatórios','Indicação de urgência e prejuízos atuais'],
'Infância e juventude':['Identificação da criança ou adolescente','Identificação e contatos dos responsáveis','Endereço e local onde se encontra','Descrição dos fatos e datas','Informação sobre risco atual','Documentos pessoais disponíveis','Escola frequentada','Unidade de saúde de referência','Atuação anterior do Conselho Tutelar','Boletim de ocorrência, quando existente','Medidas já adotadas pela rede','Pessoas que podem prestar esclarecimentos'],
'Idoso':['Identificação, idade e endereço','Contatos do idoso e familiares','Responsável ou cuidador','Descrição da possível violação','Condições de saúde e autonomia','Benefícios e fonte de renda, quando pertinentes','Atendimento pela saúde ou assistência social','Providências já solicitadas','Documentos, fotografias ou relatos','Informação sobre risco imediato','Existência de medida judicial ou protetiva'],
'Pessoa com deficiência':['Identificação e contatos','Descrição da deficiência e necessidades','Laudos e relatórios disponíveis','Barreira ou direito não assegurado','Órgão ou serviço responsável','Protocolos administrativos','Respostas ou negativas','Risco ou prejuízo atual','Tecnologia assistiva ou apoio solicitado','Representante legal, quando existente'],
'Meio ambiente':['Localização precisa do fato','Descrição e data da ocorrência','Fotografias ou vídeos','Identificação dos possíveis responsáveis','Órgãos ambientais já comunicados','Protocolos e respostas','Licenças ou autorizações mencionadas','Persistência ou cessação do dano','Risco à saúde ou à coletividade','Testemunhas ou fontes de informação'],
'Patrimônio público':['Órgão, contrato ou política pública envolvida','Descrição objetiva da possível irregularidade','Agentes ou empresas mencionados','Período dos fatos','Contratos, editais ou processos administrativos','Notas fiscais e pagamentos, quando existentes','Portal da transparência consultado','Representações e respostas anteriores','Órgão de controle interno responsável','Possível impacto financeiro ou social'],
'Consumidor e serviço público':['Identificação do usuário','Fornecedor ou órgão responsável','Descrição do serviço ou produto','Data e local do problema','Contrato, fatura ou comprovante','Protocolos de atendimento','Respostas ou negativas','Prejuízo atual','Providência pretendida','Existência de demanda coletiva semelhante'],
'Criminal':['Identificação do comunicante e envolvidos','Data, horário e local do fato','Narrativa objetiva','Boletim de ocorrência','Testemunhas','Laudos, fotografias ou vídeos','Objetos ou documentos relacionados','Medidas policiais já adotadas','Risco atual','Indicação de processo ou inquérito existente']};
function save(){try{localStorage.setItem('pjBonitoTools.v1',JSON.stringify(state.data));return true}catch{alert('O espaço do navegador está cheio. Faça backup e reduza os registros.');return false}}
function load(){try{const x=JSON.parse(localStorage.getItem('pjBonitoTools.v1'));if(x)Object.keys(state.data).forEach(k=>state.data[k]=Array.isArray(x[k])?x[k]:[])}catch{}}
function toast(s){const t=$('#toast');t.textContent=s;t.classList.remove('hidden');setTimeout(()=>t.classList.add('hidden'),2400)}
function head(){const [a,b]=PAGES[state.page];return `<div class="head"><div><h1>${a}</h1><p>${b}</p></div><button class="btn no-print" onclick="navigate('painel')">Voltar ao painel</button></div>`}
function navigate(p){state.page=p;$('#search').value='';document.querySelectorAll('#nav button').forEach(b=>b.classList.toggle('active',b.dataset.page===p));$('#side').classList.remove('open');render()}
function render(){const fn={painel:dashboard,tarefa:taskPage,ficha:analysisPage,oficios:officesPage,comparador:comparePage,cronologia:timelinePage,checklist:checklistPage,arquivo:fileNamePage,email:emailPage,prompt:promptPage,revisor:reviewPage,biblioteca:libraryPage,historico:historyPage,dados:dataPage}[state.page];$('#content').innerHTML=head();fn()}
function add(html){$('#content').insertAdjacentHTML('beforeend',html)}
function dashboard(){const expired=state.data.oficios.filter(o=>deadlineState(o)==='Vencido').length;add(`<div class="stats"><div class="stat"><span>Textos e relatórios salvos</span><b>${state.data.historico.length}</b></div><div class="stat"><span>Ofícios controlados</span><b>${state.data.oficios.length}</b></div><div class="stat"><span>Prazos vencidos</span><b>${expired}</b></div><div class="stat"><span>Modelos e casos</span><b>${state.data.biblioteca.length}</b></div></div>${expired?`<div class="notice"><b>Atenção:</b> existem ${expired} ofício(s) com prazo vencido no controle.</div>`:''}<div class="grid">${[['tarefa','✓','Tarefa para estagiário','Orientações prontas com objetivo, etapas, produto e cuidados.'],['ficha','▤','Ficha de análise','Roteiro completo para organizar informações dos autos.'],['oficios','✉','Ofícios e prazos','Controle de envio, recebimento, resposta e reiteração.'],['comparador','⇄','Conferir resposta','Matriz para comparar cada pedido com a resposta recebida.'],['cronologia','◷','Cronologia','Datas, documentos, IDs, páginas e acontecimentos.'],['checklist','☑','Checklist por assunto','Documentos e informações normalmente necessários.'],['arquivo','⌁','Nome de arquivo','Padronização para autos, pastas e encaminhamentos.'],['email','@','E-mail institucional','Encaminhamento, cobrança, reiteração e comunicação.'],['prompt','✦','Prompt guiado','Comandos completos para ChatGPT, Gemini e outros.'],['revisor','⌕','Revisor de minuta','Checklist e alertas objetivos antes da assinatura.'],['biblioteca','▣','Modelos e casos','Pesquisa por tema, resumo, providência e link.'],['historico','☷','Histórico','Recupere tudo que foi gerado e salvo.']].map(x=>`<div class="card tool-card" onclick="navigate('${x[0]}')"><div class="icon">${x[1]}</div><h3>${x[2]}</h3><p>${x[3]}</p></div>`).join('')}</div>`)}
function field(id,label,type='text',help='',example='',opts=''){let control=type==='textarea'?`<textarea id="${id}" placeholder="${esc(example)}"></textarea>`:type==='select'?`<select id="${id}">${opts.split('|').map(o=>`<option>${o}</option>`).join('')}</select>`:`<input id="${id}" type="${type}" placeholder="${esc(example)}">`;return `<div class="field ${type==='textarea'?'full':''}"><label>${label}</label>${control}${help?`<span class="help">${help}</span>`:''}</div>`}
function value(id){return ($('#'+id)?.value||'').trim()}
function result(title,text,type){add(`<section class="result" id="output"><h2>${esc(title)}</h2><pre>${esc(text)}</pre><div class="actions"><button class="btn primary" onclick="copyOutput()">Copiar</button><button class="btn" onclick="window.print()">Imprimir/PDF</button><button class="btn" onclick="saveOutput('${esc(type)}','${esc(title)}')">Salvar no histórico</button></div></section>`);$('#output').scrollIntoView({behavior:'smooth'})}
function copyOutput(){navigator.clipboard.writeText($('#output pre').textContent).then(()=>toast('Conteúdo copiado.'))}
function saveOutput(type,title){state.data.historico.unshift({id:uid(),type,title,content:$('#output pre').textContent,date:new Date().toISOString()});save();toast('Salvo no histórico.')}
function taskPage(){add(`<div class="card form-card"><div class="notice good"><b>Modo guiado:</b> escolha uma atividade. O sistema preencherá objetivo, etapas, produto esperado e cuidados.</div><div class="fields">${field('tType','Tipo de tarefa','select','','',Object.keys(TASKS).join('|'))}${field('tProc','Procedimento ou referência','text','Use o número completo, se já existir.','Ex.: NF 01.2026.00000000-0')}${field('tResp','Responsável pela tarefa','text','Nome do estagiário ou servidor.','Ex.: Estagiário(a) responsável')}${field('tDeadline','Prazo interno','date','Prazo para entregar ao responsável.')}${field('tSpecific','Orientação específica','textarea','Inclua somente o que for próprio deste caso.','Ex.: conferir especialmente os itens 2, 4 e 6 do Ofício nº 180/2026.')}</div><div class="actions"><button class="btn primary" onclick="generateTask()">Gerar tarefa</button></div></div>`)}
function generateTask(){const t=TASKS[value('tType')],specific=value('tSpecific');const text=`TAREFA INTERNA\n\nAtividade: ${value('tType')}\nProcedimento/referência: ${value('tProc')||'A informar'}\nResponsável: ${value('tResp')||'A definir'}\nPrazo interno: ${fmtDate(value('tDeadline'))||'A definir'}\n\nOBJETIVO\n${t.objetivo}\n\nETAPAS\n${t.etapas.map((x,i)=>`${i+1}. ${x}`).join('\n')}\n${specific?`\nORIENTAÇÃO ESPECÍFICA\n${specific}\n`:''}\nPRODUTO ESPERADO\n${t.produto}\n\nCUIDADOS\n${t.cuidados}\n\nAo concluir, encaminhar o material para conferência do responsável.`;result('Tarefa gerada',text,'Tarefa')}
function analysisPage(){add(`<div class="card form-card"><div class="notice"><b>Orientação:</b> preencha apenas o que estiver nos autos. Quando algo não for encontrado, registre “não localizado nos autos”.</div><div class="fields">${field('aProc','Procedimento/processo','text','Número completo ou referência interna.','Ex.: PA 09.2026.00000000-0')}${field('aTheme','Área principal','select','','','Saúde|Educação|Infância e juventude|Idoso|Pessoa com deficiência|Meio ambiente|Patrimônio público|Consumidor|Criminal|Eleitoral|Outro')}${field('aObject','Objeto principal','textarea','Descreva em uma frase o problema investigado.','Ex.: apurar possível deficiência no fornecimento de transporte escolar no Município de Bonito.')}${field('aOrigin','Origem da demanda','textarea','Quem apresentou a demanda e por qual documento.','Ex.: representação apresentada por..., recebida em...')}${field('aParts','Pessoas e órgãos envolvidos','textarea','Informe nome, qualificação disponível e papel no caso.','Ex.: Município de Bonito, por meio da Secretaria Municipal de...')}${field('aDocs','Documentos existentes','textarea','Liste documento, data, ID e páginas, quando disponíveis.','Ex.: Ofício nº 10/2026, ID..., fls...')}${field('aFacts','Fatos relevantes','textarea','Registre fatos em ordem lógica, distinguindo alegações de comprovações.','Ex.: segundo o documento..., o órgão informou que...')}${field('aProof','Elementos comprobatórios','textarea','Indique o que comprova cada informação relevante.','Ex.: relatório técnico, fotografias, planilha, contrato...')}${field('aActions','Providências já adotadas','textarea','Ofícios, reuniões, requisições, encaminhamentos e respostas.','Ex.: expedido Ofício..., com prazo de...')}${field('aPending','Pendências e dados ausentes','textarea','Inclua respostas incompletas, documentos faltantes e divergências.','Ex.: não foi apresentada a planilha mencionada na resposta.')}${field('aDeadlines','Prazos e urgências','textarea','Informe prazos em andamento, vencidos ou riscos atuais.','Ex.: prazo do Ofício nº... encerrou em...')}${field('aReview','Pontos para decisão do responsável','textarea','Não proponha conclusão definitiva; formule questões objetivas.','Ex.: avaliar necessidade de reiteração quanto aos itens...')}</div><div class="actions"><button class="btn primary" onclick="generateAnalysis()">Gerar ficha organizada</button></div></div>`)}
function generateAnalysis(){const sections=[['IDENTIFICAÇÃO',`Procedimento: ${value('aProc')||'Não informado'}\nÁrea: ${value('aTheme')}`],['OBJETO',value('aObject')],['ORIGEM DA DEMANDA',value('aOrigin')],['PESSOAS E ÓRGÃOS ENVOLVIDOS',value('aParts')],['DOCUMENTOS IDENTIFICADOS',value('aDocs')],['FATOS RELEVANTES',value('aFacts')],['ELEMENTOS COMPROBATÓRIOS',value('aProof')],['PROVIDÊNCIAS JÁ ADOTADAS',value('aActions')],['PENDÊNCIAS, DIVERGÊNCIAS E DADOS AUSENTES',value('aPending')],['PRAZOS E URGÊNCIAS',value('aDeadlines')],['PONTOS PARA ANÁLISE DO RESPONSÁVEL',value('aReview')]];result('Ficha de análise',sections.map(([h,v])=>`${h}\n${v||'Não informado ou não localizado nos autos.'}`).join('\n\n'),'Ficha de análise')}
function officesPage(){const list=state.data.oficios.slice().sort((a,b)=>(a.deadline||'9999').localeCompare(b.deadline||'9999'));add(`<div class="card form-card"><div class="fields">${field('oNum','Número do ofício','text','Inclua o ano.','Ex.: 182/2026')}${field('oProc','Procedimento','text','','Ex.: NF 01.2026.00000000-0')}${field('oDest','Destinatário/órgão','text','','Ex.: Secretaria Municipal de Educação')}${field('oSubject','Assunto','text','','Ex.: solicitação de informações')}${field('oSent','Data de envio','date')}${field('oDeadline','Prazo final','date','Informe a data final já calculada pelo responsável.')}${field('oStatus','Situação','select','','','Preparando|Enviado|Recebimento confirmado|Respondido|Resposta parcial|Prorrogação solicitada|Reiterado|Concluído')}${field('oProtocol','Protocolo/comprovante','text','','Ex.: e-mail enviado em...')}${field('oObs','Observações e pendências','textarea','Registre objetivamente o que ainda deve ser feito.','Ex.: aguardar planilha complementar mencionada no Ofício...')}</div><div class="actions"><button class="btn primary" onclick="saveOffice()">Cadastrar ofício</button></div></div><h2 style="margin-top:24px">Registros</h2>${list.length?`<div class="list">${list.map(o=>officeRow(o)).join('')}</div>`:'<div class="card"><p>Nenhum ofício cadastrado.</p></div>'}`)}
function saveOffice(){const o={id:uid(),num:value('oNum'),proc:value('oProc'),dest:value('oDest'),subject:value('oSubject'),sent:value('oSent'),deadline:value('oDeadline'),status:value('oStatus'),protocol:value('oProtocol'),obs:value('oObs'),created:new Date().toISOString()};if(!o.num||!o.dest){alert('Informe o número e o destinatário.');return}state.data.oficios.unshift(o);save();render();toast('Ofício cadastrado.')}
function deadlineState(o){if(['Respondido','Concluído'].includes(o.status)||!o.deadline)return o.status;const now=new Date();now.setHours(0,0,0,0);const d=new Date(o.deadline+'T00:00:00');const days=Math.round((d-now)/86400000);return days<0?'Vencido':days===0?'Vence hoje':days<=5?`Vence em ${days} dia(s)`:o.status}
function officeRow(o){const st=deadlineState(o),cls=st==='Vencido'?'red':st.includes('Vence')?'':'green';return `<div class="row"><div class="grow"><b>Ofício ${esc(o.num)} — ${esc(o.dest)}</b><small>${esc(o.proc||'Sem procedimento')} · prazo: ${fmtDate(o.deadline)||'não informado'} · ${esc(o.subject||'sem assunto')}</small></div><span class="tag ${cls}">${esc(st)}</span><button class="btn small" onclick="officeReport('${o.id}')">Ver</button><button class="btn small danger" onclick="deleteOffice('${o.id}')">Excluir</button></div>`}
function officeReport(id){const o=state.data.oficios.find(x=>x.id===id);result(`Ofício ${o.num}`,`CONTROLE DE OFÍCIO\n\nNúmero: ${o.num}\nProcedimento: ${o.proc||'Não informado'}\nDestinatário: ${o.dest}\nAssunto: ${o.subject||'Não informado'}\nData de envio: ${fmtDate(o.sent)||'Não informada'}\nPrazo final: ${fmtDate(o.deadline)||'Não informado'}\nSituação: ${o.status}\nSituação do prazo: ${deadlineState(o)}\nProtocolo/comprovante: ${o.protocol||'Não informado'}\nObservações e pendências: ${o.obs||'Nenhuma registrada'}`,'Controle de ofício')}
function deleteOffice(id){if(confirm('Excluir este registro de ofício?')){state.data.oficios=state.data.oficios.filter(x=>x.id!==id);save();render()}}
function comparePage(){state.matrix=[];add(`<div class="card"><div class="notice good"><b>Como usar:</b> crie uma linha para cada pergunta ou documento solicitado no ofício. Depois registre a resposta localizada e classifique o atendimento.</div><div class="fields">${field('cProc','Procedimento','text','','Ex.: NF...')}${field('cRef','Ofício e resposta analisados','text','','Ex.: Ofício nº 180/2026 e resposta nº 65/2026')}</div><div class="actions"><button class="btn" onclick="addMatrixRow()">+ Adicionar item</button><button class="btn primary" onclick="generateMatrix()">Gerar matriz</button></div><div style="overflow:auto;margin-top:14px"><table class="matrix"><thead><tr><th>Solicitação feita</th><th>Resposta localizada</th><th>Documento comprobatório</th><th>Situação</th><th></th></tr></thead><tbody id="matrixBody"></tbody></table></div></div>`);addMatrixRow()}
function addMatrixRow(){const id=uid();state.matrix.push(id);$('#matrixBody').insertAdjacentHTML('beforeend',`<tr id="m${id}"><td><textarea placeholder="Ex.: informar quantidade de veículos disponíveis"></textarea></td><td><textarea placeholder="Cole ou resuma o trecho correspondente"></textarea></td><td><textarea placeholder="Ex.: planilha não anexada"></textarea></td><td><select><option>Atendido</option><option>Parcialmente atendido</option><option>Não atendido</option><option>Não localizado</option><option>Não se aplica</option></select></td><td><button class="btn small danger" onclick="removeMatrix('${id}')">✕</button></td></tr>`)}
function removeMatrix(id){state.matrix=state.matrix.filter(x=>x!==id);$('#m'+id)?.remove()}
function generateMatrix(){const rows=state.matrix.map((id,i)=>{const x=[...document.querySelectorAll(`#m${id} textarea,#m${id} select`)].map(e=>e.value.trim());return `${i+1}. SOLICITAÇÃO: ${x[0]||'Não informada'}\nRESPOSTA: ${x[1]||'Não localizada'}\nDOCUMENTO: ${x[2]||'Não localizado'}\nSITUAÇÃO: ${x[3]}`});result('Matriz de conferência',`PROCEDIMENTO: ${value('cProc')||'Não informado'}\nDOCUMENTOS COMPARADOS: ${value('cRef')||'Não informados'}\n\n${rows.join('\n\n')}\n\nPENDÊNCIAS CONSOLIDADAS\nRevisar os itens classificados como parcialmente atendidos, não atendidos ou não localizados antes de qualquer conclusão.`,'Conferência de resposta')}
function timelinePage(){state.timeline=[];add(`<div class="card"><div class="notice"><b>Orientação:</b> registre a data do documento ou fato, não apenas a data em que ele foi localizado.</div><div class="actions"><button class="btn" onclick="addTimeline()">+ Adicionar acontecimento</button><button class="btn primary" onclick="generateTimeline()">Gerar cronologia</button></div><div style="overflow:auto;margin-top:14px"><table class="matrix"><thead><tr><th>Data</th><th>Documento/tipo</th><th>ID e páginas</th><th>Acontecimento</th><th></th></tr></thead><tbody id="timelineBody"></tbody></table></div></div>`);addTimeline()}
function addTimeline(){const id=uid();state.timeline.push(id);$('#timelineBody').insertAdjacentHTML('beforeend',`<tr id="l${id}"><td><input type="date"></td><td><input placeholder="Ex.: Ofício nº..."></td><td><input placeholder="ID..., fls..."></td><td><textarea placeholder="Descreva objetivamente o conteúdo e quem praticou o ato"></textarea></td><td><button class="btn small danger" onclick="removeTimeline('${id}')">✕</button></td></tr>`)}
function removeTimeline(id){state.timeline=state.timeline.filter(x=>x!==id);$('#l'+id)?.remove()}
function generateTimeline(){const rows=state.timeline.map(id=>[...document.querySelectorAll(`#l${id} input,#l${id} textarea`)].map(e=>e.value.trim())).filter(x=>x.some(Boolean)).sort((a,b)=>(a[0]||'9999').localeCompare(b[0]||'9999'));result('Cronologia dos autos',rows.map((x,i)=>`${i+1}. ${fmtDate(x[0])||'DATA NÃO INFORMADA'} — ${x[1]||'Documento não identificado'} (${x[2]||'referência não informada'})\n${x[3]||'Acontecimento não descrito.'}`).join('\n\n'),'Cronologia')}
function checklistPage(){add(`<div class="card form-card"><div class="fields">${field('kTheme','Assunto principal','select','A lista é orientativa e deve ser adaptada ao caso.','',Object.keys(CHECKS).join('|'))}${field('kProc','Procedimento ou atendimento','text','','Ex.: atendimento de 24/08/2026')}</div><div class="actions"><button class="btn primary" onclick="showChecklist()">Abrir checklist</button></div><div id="checks" style="margin-top:15px"></div></div>`)}
function showChecklist(){const items=CHECKS[value('kTheme')];$('#checks').innerHTML=`<h3>${esc(value('kTheme'))}</h3><div class="list">${items.map((x,i)=>`<label class="check"><input type="checkbox" data-check="${i}"><span><b>${esc(x)}</b><small>Marque somente quando a informação ou documento tiver sido conferido.</small></span></label>`).join('')}</div><div class="actions"><button class="btn primary" onclick="generateChecklist()">Gerar lista de conferência</button></div>`}
function generateChecklist(){const items=CHECKS[value('kTheme')],checked=new Set([...document.querySelectorAll('[data-check]:checked')].map(x=>+x.dataset.check));const text=`CHECKLIST — ${value('kTheme').toUpperCase()}\nReferência: ${value('kProc')||'Não informada'}\n\n${items.map((x,i)=>`${checked.has(i)?'[CONFERIDO]':'[PENDENTE]'} ${x}`).join('\n')}\n\nObservação: a lista é orientativa e não substitui a avaliação das particularidades do caso.`;result('Checklist de documentos e informações',text,'Checklist')}
function fileNamePage(){add(`<div class="card form-card"><div class="notice good"><b>Padrão sugerido:</b> procedimento_tipo-número_destinatário-assunto_data.extensão. O sistema removerá acentos e caracteres incompatíveis.</div><div class="fields">${field('nProc','Procedimento','text','Pode ser abreviado.','Ex.: NF-01.2026.00018915-9')}${field('nType','Tipo de documento','select','','','Oficio|Resposta|Despacho|Certidao|Relatorio|Manifestacao|Portaria|Ata|Email|Documento|Anexo')}${field('nNum','Número do documento','text','Quando não houver, deixe vazio.','Ex.: 182-2026')}${field('nDest','Órgão, pessoa ou origem','text','Use nome curto e identificável.','Ex.: SEMED-Bonito')}${field('nSubject','Assunto curto','text','Use de duas a cinco palavras.','Ex.: transporte-escolar')}${field('nDate','Data do documento','date')}${field('nExt','Extensão','select','','','pdf|docx|xlsx|jpg|png|html|txt')}</div><div class="actions"><button class="btn primary" onclick="generateFileName()">Gerar nome</button></div></div>`)}
function cleanName(s){return s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-zA-Z0-9.-]+/g,'-').replace(/-+/g,'-').replace(/^-|-$/g,'')}
function generateFileName(){const parts=[value('nProc'),value('nType')+(value('nNum')?'-'+value('nNum'):''),value('nDest'),value('nSubject'),value('nDate')].filter(Boolean).map(cleanName);result('Nome padronizado',parts.join('_')+'.'+value('nExt'),'Nome de arquivo')}
function emailPage(){add(`<div class="card form-card"><div class="fields">${field('eType','Finalidade','select','','','Encaminhamento de ofício|Reiteração de solicitação|Cobrança de resposta|Encaminhamento de documento|Confirmação de recebimento|Solicitação de reunião|Comunicação geral')}${field('eTo','Destinatário','text','','Ex.: Senhor Secretário Municipal de Educação')}${field('eDoc','Documento encaminhado','text','','Ex.: Ofício nº 182/2026-MP/PJB')}${field('eProc','Procedimento relacionado','text','','Ex.: NF 01.2026.00000000-0')}${field('eSubject','Assunto resumido','text','','Ex.: transporte escolar')}${field('eDeadline','Prazo ou data relevante','text','Escreva como deve aparecer.','Ex.: 30 dias corridos')}${field('eExtra','Informação adicional','textarea','Opcional: anexos, pedido de confirmação ou orientação.','Ex.: solicita-se confirmação de recebimento.')}${field('eSign','Assinatura','textarea','Deixe preparada para reutilização.','Atenciosamente,\nPromotoria de Justiça de Bonito/PA')}</div><div class="actions"><button class="btn primary" onclick="generateEmail()">Gerar e-mail</button></div></div>`)}
function generateEmail(){const type=value('eType'),to=value('eTo')||'Senhor(a)',doc=value('eDoc')||'documento',proc=value('eProc'),subject=value('eSubject'),deadline=value('eDeadline'),extra=value('eExtra'),sign=value('eSign')||'Atenciosamente,\nPromotoria de Justiça de Bonito/PA';let body={
'Encaminhamento de ofício':`${to},\n\nCumprimentando-o(a), encaminha-se, em anexo, o ${doc}${proc?`, referente ao ${proc}`:''}, para conhecimento e adoção das providências solicitadas${deadline?`, no prazo de ${deadline}`:''}.\n\nSolicita-se a confirmação do recebimento desta mensagem.`,
'Reiteração de solicitação':`${to},\n\nCumprimentando-o(a), reitera-se a solicitação constante do ${doc}${proc?`, expedido no âmbito do ${proc}`:''}, considerando que, até o presente momento, não foi localizada resposta integral.\n\nSolicita-se o encaminhamento das informações e documentos pendentes${deadline?` no prazo de ${deadline}`:''}, com referência ao procedimento indicado.`,
'Cobrança de resposta':`${to},\n\nCumprimentando-o(a), solicita-se informação acerca do atendimento ao ${doc}${proc?`, relacionado ao ${proc}`:''}, cujo prazo transcorreu sem que fosse localizada resposta nesta Promotoria de Justiça.\n\nCaso a resposta já tenha sido encaminhada, solicita-se o reenvio, acompanhado do respectivo comprovante.`,
'Encaminhamento de documento':`${to},\n\nCumprimentando-o(a), encaminha-se, em anexo, ${doc}${proc?`, para juntada e conhecimento no ${proc}`:''}.`,
'Confirmação de recebimento':`${to},\n\nCumprimentando-o(a), solicita-se a confirmação do recebimento do ${doc}${proc?`, referente ao ${proc}`:''}, encaminhado anteriormente por correio eletrônico.`,
'Solicitação de reunião':`${to},\n\nCumprimentando-o(a), solicita-se a realização de reunião para tratar de ${subject||'assunto de interesse institucional'}${proc?`, no âmbito do ${proc}`:''}.\n\nSolicita-se a indicação de datas e horários disponíveis para alinhamento.`,
'Comunicação geral':`${to},\n\nCumprimentando-o(a), encaminha-se a presente comunicação referente a ${subject||doc}${proc?`, no âmbito do ${proc}`:''}.`}[type];const text=`ASSUNTO: ${type}${subject?' — '+subject:''}\n\n${body}${extra?'\n\n'+extra:''}\n\n${sign}`;result('E-mail institucional',text,'E-mail')}
function promptPage(){add(`<div class="card form-card"><div class="notice"><b>Proteção de dados:</b> não envie documentos sigilosos ou dados pessoais a ferramentas externas sem autorização institucional. Quando possível, anonimize o conteúdo.</div><div class="fields">${field('pTask','Tarefa da IA','select','','','Resumir documento|Criar cronologia|Comparar ofício e resposta|Extrair partes e qualificações|Identificar pendências|Revisar minuta|Organizar relatório|Sugerir perguntas para diligência|Explicar documento')}${field('pContext','Contexto e finalidade','textarea','Explique onde o resultado será utilizado.','Ex.: análise preliminar de resposta municipal em procedimento de educação.')}${field('pInput','Conteúdo ou descrição dos documentos','textarea','Cole o texto permitido ou descreva os arquivos.','Ex.: ofício expedido e resposta recebida.')}${field('pRules','Cuidados específicos','textarea','O sistema já incluirá regras contra invenção.','Ex.: citar ID e páginas somente quando estiverem expressamente informados.')}${field('pFormat','Formato desejado','select','','','Texto organizado|Tabela|Relatório por tópicos|Cronologia|Matriz comparativa|Checklist')}</div><div class="actions"><button class="btn primary" onclick="generatePrompt()">Gerar prompt completo</button></div></div>`)}
function generatePrompt(){const text=`ATIVIDADE\n${value('pTask')}\n\nCONTEXTO E FINALIDADE\n${value('pContext')||'Realizar análise preliminar para conferência do responsável.'}\n\nCONTEÚDO A SER ANALISADO\n${value('pInput')||'[INSERIR OU ANEXAR O CONTEÚDO]'}\n\nINSTRUÇÕES OBRIGATÓRIAS\n1. Leia integralmente o conteúdo antes de responder.\n2. Utilize somente informações existentes no material fornecido.\n3. Não invente nomes, datas, números, documentos, fundamentos ou acontecimentos.\n4. Diferencie fatos comprovados, alegações e informações não confirmadas.\n5. Quando algo não estiver disponível, escreva “não localizado no conteúdo fornecido”.\n6. Aponte contradições, lacunas e informações que exigem conferência humana.\n7. Preserve números de documentos, IDs e páginas exatamente como informados.\n8. Não apresente conclusão jurídica definitiva nem substitua a análise do responsável.\n${value('pRules')?`9. ${value('pRules')}\n`:''}\nFORMATO DA RESPOSTA\n${value('pFormat')}. Apresente primeiro os dados identificados e, ao final, uma seção específica de pendências e pontos para revisão.`;result('Prompt guiado',text,'Prompt')}
function reviewPage(){add(`<div class="card form-card"><div class="fields">${field('rText','Cole a minuta','textarea','A análise é baseada em regras simples e checklist; não substitui revisão jurídica.','Cole aqui o texto completo da minuta.')}</div><h3>Conferências manuais</h3><div class="list">${['Número do procedimento conferido','Número e ano do documento conferidos','Nome, cargo e órgão do destinatário conferidos','Nomes das partes conferidos','Datas e prazos conferidos','Pedidos estão claros e numerados','Anexos mencionados estão disponíveis','Assunto corresponde ao conteúdo','Assinatura e identificação da unidade estão corretas','Documento foi submetido à revisão do responsável'].map((x,i)=>`<label class="check"><input type="checkbox" data-review="${i}"><span>${x}</span></label>`).join('')}</div><div class="actions"><button class="btn primary" onclick="reviewText()">Gerar relatório de revisão</button></div></div>`)}
function reviewText(){const t=value('rText'),alerts=[];if(!t)alerts.push('Nenhum texto foi inserido.');if(/\[.*?\]|xxxx|preencher|inserir|___/i.test(t))alerts.push('Possível campo não preenchido localizado.');if(!/prazo/i.test(t))alerts.push('O texto não contém a palavra “prazo”; verifique se isso é adequado ao documento.');if(!/assunto/i.test(t))alerts.push('Não foi localizada indicação expressa de assunto.');if(!/atenciosamente|promotor|promotoria|assinado/i.test(t))alerts.push('Não foi localizada assinatura ou identificação final evidente.');const checks=[...document.querySelectorAll('[data-review]')];const pending=checks.filter(x=>!x.checked).map(x=>x.parentElement.innerText.trim());const text=`RELATÓRIO DE CONFERÊNCIA\n\nALERTAS AUTOMÁTICOS\n${alerts.length?alerts.map(x=>'[ATENÇÃO] '+x).join('\n'):'Nenhum alerta textual simples foi identificado.'}\n\nCHECKLIST MANUAL\n${checks.map(x=>`${x.checked?'[CONFERIDO]':'[PENDENTE]'} ${x.parentElement.innerText.trim()}`).join('\n')}\n\nRESULTADO\n${pending.length?`Permanecem ${pending.length} item(ns) pendente(s) de conferência.`:'Todos os itens manuais foram marcados como conferidos.'}\n\nEste relatório não atesta a correção jurídica da minuta e não substitui a revisão do responsável.`;result('Relatório de revisão',text,'Revisão')}
function libraryPage(){const list=state.data.biblioteca;add(`<div class="card form-card"><div class="fields">${field('bTitle','Título','text','','Ex.: Ofício sobre maus-tratos a animais')}${field('bType','Tipo','select','','','Modelo|Caso anterior|Ofício enviado|Resposta recebida|Despacho|Relatório|Legislação|Orientação interna')}${field('bTheme','Assunto','text','','Ex.: meio ambiente; maus-tratos')}${field('bSummary','Resumo e utilidade','textarea','Explique o que existe e quando pode ser reaproveitado.','Ex.: modelo de perguntas à vigilância e ao órgão ambiental.')}${field('bActions','Providências ou resultado','textarea','Especialmente útil para registrar casos anteriores.','Ex.: foram oficiados os órgãos...')}${field('bLink','Link do arquivo','url','Use link autorizado do OneDrive, pasta institucional ou outra localização.','https://...')}${field('bTags','Palavras-chave','text','Separe por vírgula.','maus-tratos, animais, ofício')}</div><div class="actions"><button class="btn primary" onclick="saveLibrary()">Cadastrar item</button></div></div><h2 style="margin-top:24px">Itens cadastrados</h2>${list.length?`<div class="list">${list.map(x=>`<div class="row"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.type)} · ${esc(x.theme)} · ${esc(x.tags)}</small></div>${x.link?`<a class="btn small primary" href="${esc(x.link)}" target="_blank" rel="noopener">Abrir</a>`:''}<button class="btn small" onclick="libraryReport('${x.id}')">Ver</button><button class="btn small danger" onclick="deleteLibrary('${x.id}')">Excluir</button></div>`).join('')}</div>`:'<div class="card"><p>Nenhum item cadastrado.</p></div>'}`)}
function saveLibrary(){const x={id:uid(),title:value('bTitle'),type:value('bType'),theme:value('bTheme'),summary:value('bSummary'),actions:value('bActions'),link:value('bLink'),tags:value('bTags'),date:new Date().toISOString()};if(!x.title){alert('Informe o título.');return}state.data.biblioteca.unshift(x);save();render();toast('Item cadastrado.')}
function libraryReport(id){const x=state.data.biblioteca.find(y=>y.id===id);result(x.title,`TIPO: ${x.type}\nASSUNTO: ${x.theme||'Não informado'}\nPALAVRAS-CHAVE: ${x.tags||'Não informadas'}\n\nRESUMO E UTILIDADE\n${x.summary||'Não informado'}\n\nPROVIDÊNCIAS OU RESULTADO\n${x.actions||'Não informado'}\n\nLINK\n${x.link||'Não informado'}`,'Biblioteca')}
function deleteLibrary(id){if(confirm('Excluir este item?')){state.data.biblioteca=state.data.biblioteca.filter(x=>x.id!==id);save();render()}}
function historyPage(){const list=state.data.historico;add(list.length?`<div class="list">${list.map(x=>`<div class="row"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.type)} · ${new Date(x.date).toLocaleString('pt-BR')}</small></div><button class="btn small" onclick="historyView('${x.id}')">Ver</button><button class="btn small danger" onclick="deleteHistory('${x.id}')">Excluir</button></div>`).join('')}</div>`:'<div class="card"><p>Nenhum conteúdo foi salvo no histórico.</p></div>')}
function historyView(id){const x=state.data.historico.find(y=>y.id===id);result(x.title,x.content,x.type)}
function deleteHistory(id){if(confirm('Excluir este conteúdo?')){state.data.historico=state.data.historico.filter(x=>x.id!==id);save();render()}}
function dataPage(){const size=(new Blob([JSON.stringify(state.data)]).size/1024/1024).toFixed(2);add(`<div class="notice"><b>Importante:</b> os dados ficam neste navegador e computador. Exporte um backup regularmente. Não envie o arquivo de backup para locais não autorizados.</div><div class="grid"><div class="card"><h3>Exportar backup</h3><p>Inclui histórico, ofícios e biblioteca.</p><button class="btn primary" onclick="exportData()">Baixar backup</button></div><div class="card"><h3>Restaurar backup</h3><p>Importe um arquivo gerado por esta ferramenta.</p><button class="btn" onclick="$('#importFile').click()">Selecionar backup</button></div><div class="card"><h3>Uso aproximado</h3><p>${size} MB armazenados no navegador.</p></div><div class="card"><h3>Limpar dados</h3><p>Faça backup antes. Esta ação não pode ser desfeita.</p><button class="btn danger" onclick="clearData()">Apagar tudo</button></div></div>`)}
function exportData(){const p={app:'Ferramentas PJ Bonito',version:1,date:new Date().toISOString(),data:state.data},a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(p,null,2)],{type:'application/json'}));a.download=`Ferramentas-PJ-Bonito-backup-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(a.href)}
$('#importFile').onchange=async e=>{try{const p=JSON.parse(await e.target.files[0].text());if(p.app!=='Ferramentas PJ Bonito'||!p.data)throw Error();if(confirm('Restaurar este backup e substituir os dados atuais?')){state.data=p.data;save();render();toast('Backup restaurado.')}}catch{alert('Backup inválido.')}e.target.value=''}
function clearData(){if(confirm('Apagar todos os dados locais?')&&confirm('Confirma a exclusão?')){state.data={historico:[],oficios:[],biblioteca:[]};save();render()}}
function fmtDate(s){if(!s)return'';const [y,m,d]=s.split('-');return d&&m&&y?`${d}/${m}/${y}`:s}
function globalSearch(q){q=q.toLowerCase();const all=[...state.data.historico.map(x=>({...x,kind:'Histórico',text:x.content})),...state.data.oficios.map(x=>({id:x.id,title:`Ofício ${x.num} — ${x.dest}`,kind:'Ofício',text:Object.values(x).join(' ')})),...state.data.biblioteca.map(x=>({id:x.id,title:x.title,kind:'Biblioteca',text:Object.values(x).join(' ')}))].filter(x=>(x.title+' '+x.text).toLowerCase().includes(q));$('#content').innerHTML=`<div class="head"><div><h1>Resultados da pesquisa</h1><p>Busca por “${esc(q)}”</p></div><button class="btn" onclick="navigate('painel')">Fechar pesquisa</button></div>`+(all.length?`<div class="list">${all.map(x=>`<div class="row"><div class="grow"><b>${esc(x.title)}</b><small>${esc(x.kind)} · ${esc((x.text||'').slice(0,150))}</small></div></div>`).join('')}</div>`:'<div class="card"><p>Nenhum resultado encontrado.</p></div>')}
$('#search').addEventListener('input',e=>e.target.value.trim()?globalSearch(e.target.value.trim()):render());$('#nav').onclick=e=>{const b=e.target.closest('[data-page]');if(b)navigate(b.dataset.page)};$('#menu').onclick=()=>$('#side').classList.toggle('open');load();render();
</script></body></html>
